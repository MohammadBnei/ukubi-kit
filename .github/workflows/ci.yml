name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Forgejo's Talos runner (k8s-ubuntu-latest), or GitHub's ubuntu-latest on the mirror. The build is Bun's, and dist must not
    # depend on the platform: Bun's Math functions are the platform's libm, so the check runs on Linux here and on
    # macOS in check-macos
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'k8s-ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Biome lint and format check (once: the result does not depend on the OS)
      - run: bun run lint
      # the procgen library's own tests (winding, cells, determinism) and the skin weights'
      - run: bun run test
      # the pinned kit files: keyed by the locks, so a new pin refetches and nothing stale is ever trusted (the build
      # checks every file against the lock anyway)
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push never restores
      # (a PR job can forge the cache write key), it runs cold and only saves. Decided here in shell.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$(cat kits/*/lock.json | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-kits-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-kits-${RUNNER_OS}-"
          } >> "$GITHUB_OUTPUT"
      - name: Restore kit files
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      # rebuild from the pinned kits (sha256-locked) and fail unless dist/ is what was committed
      - run: bun run check
      - name: Save kit files
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false # no built-in cache: it would restore on main
      - run: go vet ./... && go test ./...
  check-macos:
    # the same Bun check on macOS. GitHub-only: Forgejo has no macOS runner, so it skips this job and the GitHub
    # mirror runs it. Forgejo checks a job's if: only on a runner, and a job for a label no runner has waits forever:
    # off GitHub the job asks for k8s-ubuntu-latest, where the if: skips it
    if: github.server_url == 'https://github.com'
    runs-on: ${{ github.server_url == 'https://github.com' && 'macos-latest' || 'k8s-ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push never restores
      # (a PR job can forge the cache write key), it runs cold and only saves. Decided here in shell.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$(cat kits/*/lock.json | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-kits-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-kits-${RUNNER_OS}-"
          } >> "$GITHUB_OUTPUT"
      - name: Restore kit files
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      - run: bun run check
      - name: Save kit files
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
  node:
    # and dist must not depend on the engine: the same check under Node (V8 carries its own Math)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'k8s-ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push never restores
      # (a PR job can forge the cache write key), it runs cold and only saves. Decided here in shell.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$(cat kits/*/lock.json | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-kits-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-kits-${RUNNER_OS}-"
          } >> "$GITHUB_OUTPUT"
      - name: Restore kit files
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      - run: node --test 'tools/**/*.test.mjs'
      - run: node tools/build.mjs --check
      - name: Save kit files
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
