name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # GitHub-hosted only: this repo is public, and a public repo's PR must never reach a self-hosted runner. The build
    # is Bun's, and dist must not depend on the platform: Bun's Math functions are the platform's libm, so the check
    # runs on Linux and on macOS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # the procgen library's own tests (winding, cells, determinism) and the skin weights'
      - run: bun run test
      # the pinned kit files: keyed by the locks, so a new pin refetches and nothing stale is ever trusted (the build
      # checks every file against the lock anyway)
      - uses: actions/cache@v4
        with:
          path: cache
          key: kits-${{ hashFiles('kits/*/lock.json') }}
      # rebuild from the pinned kits (sha256-locked) and fail unless dist/ is what was committed
      - run: bun run check
      - uses: actions/setup-go@v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          go-version: '1.27'
      - if: matrix.os == 'ubuntu-24.04'
        run: go vet ./... && go test ./...
  node:
    # and dist must not depend on the engine: the same check under Node (V8 carries its own Math)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: actions/cache@v4
        with:
          path: cache
          key: kits-${{ hashFiles('kits/*/lock.json') }}
      - run: node --test 'tools/**/*.test.mjs'
      - run: node tools/build.mjs --check
