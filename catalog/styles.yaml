# Styles (plan/13 §5): a civ's look per age. A style is an OKLab treatment of every pixel of a kit's atlas
# (L' = l0 + lk·L; a', b' = s·(a, b) + tint) and, per kit, cells given a colour ("col,row" of the 8×4 swatch grid,
# row 0 at the top; the cell keeps its own gradient and detail around it). tools/style.mjs paints them; the game swaps
# the texture, never the geometry. A civ's colour is its buildings' team colour (catalog/civs.yaml).
#
# What the cells hold, from the models' UVs (bun tools/cells.mjs <kit> [model…] counts the cells models use):
#   hexagon  0,3 team (roofs, banners)  2,0 stone  6,0 timber  0,2 grass  6,1 grey stone  3,0 dark stone
#   city     1,0 trim  2,0 light grey  5,0 brick  2,1 blue-grey facade  3,1 ochre facade  6,2 red facade  3,2 green
#   space    2,0 hull  1,0 white  3,1 band  3,0 dark panel  4,1 red  2,2 green cargo
#   dungeon  1,0 wall stone  0,0 dark trim  4,0 wood  5,0 floor  7,2 gold  6,2 banner  0,1 banner white  7,0 rubble
#   halloween 3,0 stone  7,0 roof and pumpkins  1,0 iron  7,1 wood and bark  6,1 dirt  4,0 candles  0,1 orange pines
#   prototype 0,0 blocks  2,0 walls  1,1 trim  6,0 pallets and doors  3,0 floor  1,0 boxes  (swatches only: row 0, 0,1, 1,1)
#   ukubi    a made kit: its cells are named by its palette (kits/ukubi/models.mjs), and its styles use the names:
#            plaster timber brick slate concrete steel team glass dark metal soot hazard moss sand rust lit
#   hexagon's team cells, one per colour of its buildings: 0,3 blue, 1,3 red, 2,3 yellow, 3,3 green
# Every civ is medieval (catalog/civs.yaml): its styles paint hexagon only. Each colours the hex tile's grass (0,2: its
# district's ground), its buildings' team cell (their colour, saturated past the treatment) and 0,3 (the construction
# props every civ shares) in the same colour.
# The civ styles share one treatment family (l0 ≈ .38, lk ≈ .55, s ≈ .5) so mixed kits read as one world, and differ
# by their cells.
pack: # the packs' own colours, untouched: the reference every style is judged against
  l0: 0
  lk: 1
  s: 1
clay: # mountain's town (clay.png), fitted; its grass a little greener than the fit
  l0: 0.423
  lk: 0.461
  s: 0.269
  tint: [-0.0056, 0.0149]
  cells:
    hexagon: { "0,2": "#9fb487" }
