# The civs (plan/13 §2) as the kit draws them. A civ draws from one kit only (`kit`; build.mjs refuses a model of
# another): per role (a building's function in the game) the model for each age, first to last, a list in a slot
# being variants the game picks from by a hash of the building's id. A role a civ doesn't list draws its own
# `product`, never another civ's. Models are a kit's own (kit/name) or a recipe (recipe/id) of that kit.
#
# Every civ is a medieval village (owner, 2026-10-31: "all medieval, colour per village"): it draws the Medieval
# Hexagon pack's buildings in one team colour of the pack's four (one atlas: a colour is the models' UVs on its own
# team cell, which the civ's styles colour). Eight villages share four colours, two each: blue the town centre's
# (default) and platform's, yellow apps' and data's, green code's and fleet's, red operations' and guard's.
#
# `shapes` tags some variants with one shape each (catalog/shapes.yaml): the game draws a building among the variants
# whose shape it asks for, else among the slot's untagged ones, else among all of them. A shape says what the model
# looks like, never what it stands for.
#
# Its biome is from the same kit: the hex tiles in its styles' ground colour, a `plot` under every building (a floor
# piece of the kit; none for a kit whose buildings stand on their own base: hexagon's each stand on their own hex),
# and `dress`, seeded variants of the kit's props on the free land. default is the town centre's (the town's own, not
# a civ's) and an unknown realm's.
default: # the town centre, blue: every role
  kit: hexagon
  styles: [clay, clay]
  roles:
    town-centre: [recipe/keep, recipe/castle-flags]
    houses: [[hexagon/building_home_A_blue, hexagon/building_home_B_blue], [hexagon/building_home_B_blue, recipe/home-yard]]
    workshop: [hexagon/building_blacksmith_blue, [hexagon/building_blacksmith_blue, hexagon/building_lumbermill_blue]]
    economy: [hexagon/building_mine_blue, [hexagon/building_mine_blue, hexagon/building_grain]]
    utility: [[hexagon/building_well_blue, hexagon/building_windmill_blue], [hexagon/building_windmill_blue, hexagon/building_watermill_blue]]
    defence: [hexagon/building_tower_base_blue, [recipe/tower-flag, hexagon/building_tower_B_blue]]
    trade: [hexagon/building_market_blue, [hexagon/building_market_blue, hexagon/building_tavern_blue]]
    barracks: [hexagon/building_barracks_blue, [hexagon/building_barracks_blue, hexagon/building_archeryrange_blue]]
    product: [hexagon/building_home_A_blue, hexagon/building_church_blue]
  dress: { count: 4, parts: [hexagon/tree_single_A, hexagon/tree_single_B, hexagon/rock_single_A, hexagon/rock_single_C] }
apps: # yellow, the bazaar: market stalls, taverns and homes, then a busier market and an inn
  kit: hexagon
  styles: [bazaar-1, bazaar-2]
  roles:
    product: [[hexagon/building_market_yellow, hexagon/building_tavern_yellow, hexagon/building_home_A_yellow, hexagon/building_home_B_yellow], [hexagon/building_market_yellow, hexagon/building_tavern_yellow, hexagon/building_home_B_yellow, hexagon/building_windmill_yellow]]
    houses: [[hexagon/building_home_A_yellow, hexagon/building_home_B_yellow], [hexagon/building_home_B_yellow, hexagon/building_tavern_yellow]]
    trade: [[hexagon/building_market_yellow, hexagon/building_tavern_yellow], [hexagon/building_market_yellow, hexagon/building_tavern_yellow]]
  shapes: { hexagon/building_market_yellow: yard, hexagon/building_tavern_yellow: wide, hexagon/building_home_B_yellow: tower, hexagon/building_windmill_yellow: mill }
  dress: { count: 4, scale: 0.8, parts: [hexagon/barrel, hexagon/crate_A_small, hexagon/sack, hexagon/crate_long_A, hexagon/tree_single_A, hexagon/flag_yellow] }
platform: # blue, the étoile: a well, a windmill and a tower base, then its towers
  kit: hexagon
  styles: [fortress-1, fortress-2]
  roles:
    product: [[hexagon/building_well_blue, hexagon/building_windmill_blue, hexagon/building_tower_base_blue, hexagon/building_home_A_blue], [hexagon/building_tower_A_blue, hexagon/building_tower_B_blue, hexagon/building_windmill_blue]]
    utility: [[hexagon/building_well_blue, hexagon/building_windmill_blue, hexagon/building_tower_base_blue, hexagon/building_mine_blue], [hexagon/building_windmill_blue, hexagon/building_well_blue, hexagon/building_tower_A_blue, hexagon/building_mine_blue]]
    defence: [hexagon/building_tower_base_blue, [hexagon/building_tower_A_blue, hexagon/building_tower_B_blue]]
  shapes: { hexagon/building_windmill_blue: mill, hexagon/building_tower_base_blue: tower, hexagon/building_mine_blue: pit, hexagon/building_tower_A_blue: tower, hexagon/building_tower_B_blue: tower }
  dress: { count: 4, scale: 0.7, parts: [hexagon/tree_single_A, hexagon/tree_single_B, hexagon/rock_single_A, hexagon/rock_single_C, hexagon/flag_blue] }
code: # green, the presqu'île: a smithy, a lumber mill and homes, then a watermill joins them
  kit: hexagon
  styles: [forge-1, forge-2]
  roles:
    product: [[hexagon/building_blacksmith_green, hexagon/building_lumbermill_green, hexagon/building_home_A_green], [hexagon/building_blacksmith_green, hexagon/building_lumbermill_green, hexagon/building_watermill_green]]
    workshop: [[hexagon/building_blacksmith_green, hexagon/building_lumbermill_green], [hexagon/building_blacksmith_green, hexagon/building_lumbermill_green, hexagon/building_watermill_green]]
  shapes: { hexagon/building_lumbermill_green: mill, hexagon/building_watermill_green: mill }
  dress: { count: 4, scale: 0.8, parts: [hexagon/resource_lumber, hexagon/crate_B_small, hexagon/barrel, hexagon/tree_single_B, hexagon/wheelbarrow] }
operations: # red, the harbour: a market, a lumber mill, a mine and a watch tower, then barracks and a watermill by the water
  kit: hexagon
  styles: [harbour-1, harbour-2]
  roles:
    product: [[hexagon/building_market_red, hexagon/building_lumbermill_red, hexagon/building_mine_red, hexagon/building_home_B_red], [hexagon/building_market_red, hexagon/building_watermill_red, hexagon/building_barracks_red, hexagon/building_mine_red]]
    trade: [[hexagon/building_market_red, hexagon/building_lumbermill_red, hexagon/building_home_B_red, hexagon/building_tower_base_red], [hexagon/building_market_red, hexagon/building_lumbermill_red, hexagon/building_watermill_red, hexagon/building_tower_A_red, hexagon/building_barracks_red]]
    economy: [[hexagon/building_mine_red, hexagon/building_lumbermill_red], [hexagon/building_mine_red, hexagon/building_watermill_red]]
  shapes: { hexagon/building_market_red: yard, hexagon/building_lumbermill_red: bay, hexagon/building_mine_red: pit, hexagon/building_watermill_red: mill, hexagon/building_barracks_red: wide, hexagon/building_tower_base_red: tower, hexagon/building_tower_A_red: tower }
  dress: { count: 4, scale: 0.8, parts: [hexagon/crate_long_A, hexagon/pallet, hexagon/barrel, hexagon/sack, hexagon/resource_stone] }
guard: # red, the watch fort: a tower base, a gate and an archery range, then a catapult tower, a gatehouse and barracks
  kit: hexagon
  styles: [vigil-1, vigil-2]
  roles:
    product: [[hexagon/building_tower_base_red, hexagon/building_archeryrange_red, hexagon/building_tower_A_red], [hexagon/building_tower_catapult_red, hexagon/building_tower_B_red, hexagon/building_barracks_red, hexagon/building_archeryrange_red]]
    defence: [[hexagon/building_tower_base_red, hexagon/building_tower_A_red, recipe/fort-gate], [hexagon/building_tower_catapult_red, hexagon/building_tower_B_red, recipe/fort-gatehouse]]
    barracks: [hexagon/building_archeryrange_red, [hexagon/building_barracks_red, hexagon/building_archeryrange_red]]
  shapes: { hexagon/building_tower_base_red: tower, hexagon/building_archeryrange_red: yard, hexagon/building_tower_catapult_red: tower, hexagon/building_barracks_red: wide, recipe/fort-gate: gate, recipe/fort-gatehouse: gate }
  dress: { count: 4, scale: 0.8, parts: [hexagon/target, hexagon/weaponrack, hexagon/bucket_arrows, hexagon/rock_single_A, hexagon/flag_red] }
data: # yellow, the lakeside: a well, a church, a granary and homes, then the church and a watermill on the lake
  kit: hexagon
  styles: [abbey-1, abbey-2]
  roles:
    product: [[hexagon/building_well_yellow, hexagon/building_church_yellow, hexagon/building_home_A_yellow], [hexagon/building_church_yellow, hexagon/building_watermill_yellow, hexagon/building_well_yellow]]
    economy: [[hexagon/building_well_yellow, hexagon/building_church_yellow, hexagon/building_grain], [hexagon/building_church_yellow, hexagon/building_watermill_yellow, hexagon/building_grain]]
  shapes: { hexagon/building_watermill_yellow: mill, hexagon/building_church_yellow: tower, hexagon/building_grain: vault }
  dress: { count: 4, scale: 0.8, parts: [hexagon/tree_single_B, hexagon/rock_single_A, hexagon/bucket_water, hexagon/sack, hexagon/tree_single_A] }
fleet: # green, the roots camp: barracks, a smithy, a lumber mill and a mine, then a tower base joins them
  kit: hexagon
  styles: [garrison-1, garrison-2]
  roles:
    product: [[hexagon/building_barracks_green, hexagon/building_blacksmith_green, hexagon/building_mine_green], [hexagon/building_barracks_green, hexagon/building_mine_green, hexagon/building_blacksmith_green, hexagon/building_tower_base_green]]
    barracks: [[hexagon/building_barracks_green, hexagon/building_lumbermill_green, hexagon/building_mine_green], [hexagon/building_barracks_green, hexagon/building_tower_base_green, hexagon/building_lumbermill_green]]
  shapes: { hexagon/building_barracks_green: wide, hexagon/building_mine_green: pit, hexagon/building_tower_base_green: tower, hexagon/building_lumbermill_green: mill }
  dress: { count: 4, scale: 0.8, parts: [hexagon/tent, hexagon/wheelbarrow, hexagon/resource_stone, hexagon/crate_A_small, hexagon/flag_green] }
# The world kit: the hex tiles every district stands on and the construction states every civ shares, painted in each
# civ's style. build.mjs names no kit: it reads this. `tiles` are its models that are tiles (each lies at its own
# origin, never grounded); `ground` is the cell a style colours for a district's ground, `team` the cell the shared
# construction props show a civ's colour in ("col,row" on the atlas grid; quoted, since in flow style a bare 0,2 splits
# at the comma). `world` and `states` are reserved: neither names a civ.
world:
  kit: hexagon
  tiles: [hex_grass]
  ground: '0,2'
  team: '0,3'

# Construction (plan/13 §3): a goal's work in progress puts scaffold up around its standing building (the frame, at the
# building's hex, then props beside it); a new building rises through the stages. Shared by every civ (a world state,
# like the hex tiles), painted in the civ's style.
states:
  scaffold: [hexagon/building_scaffolding, hexagon/ladder, hexagon/wheelbarrow]
  stages: [hexagon/building_dirt, hexagon/building_stage_A, hexagon/building_stage_B, hexagon/building_stage_C]
  wonder: [recipe/monument] # a wonder that stands (its rising uses the stages: the banner names it)
