# KayKit Medieval Hexagon Pack 1.0, free tier (CC0), pinned by commit. Each model's .gltf and .bin are fetched;
# the pack's one atlas is the image every model's UVs point into.
name: hexagon
repo: KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0
commit: 84fa4e91af6a88989be7c99e0891cede11f2ca38
root: addons/kaykit_medieval_hexagon_pack/Assets/gltf
atlas: buildings/blue/hexagons_medieval.png
licence: CC0-1.0
# the pack's hex tile is 2 flat-to-flat; its buildings already stand on one, so no normalising scale
scale: 1
# a hex model turns in sixths; a square kit's in quarters (City's in halves: its blocks face one street)
turns: 6
# path prefixes whose models keep their own origin, never grounded: a tile's top at y = 0, its column down to -1
unground: [tiles/]
